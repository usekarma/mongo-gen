simulation:
  seed: 42
  start_time: "now"
  duration_seconds: 900
  speed: 10

spawn:
  rate_per_second: 1.5
  max_inflight: 200

process:
  attributes:
    subscriber_id: { dist: weighted_choice, values: { sub_000001: 5, sub_000002: 5, sub_000003: 1 } }
    report_type:   { dist: weighted_choice, values: { DAILY: 6, WEEKLY: 2, FRAUD: 2 } }

stages:
  - name: requested
    enter:
      set:
        status: requested
        requested_at: now_utc
    duration_ms: "uniform(50,400)"
    outcomes:
      - to: running
        weight: 1

  - name: running
    enter:
      set:
        status: running
        started_at: now_utc
    duration_ms: "lognormal(8000,0.7)"
    outcomes:
      - to: completed
        weight: 98
      - to: failed
        weight: 2
        set:
          error_code: { dist: weighted_choice, values: { TIMEOUT: 5, DOWNSTREAM_5XX: 3, VALIDATION: 2 } }
          error_message: "error={{error_code}}"

  - name: completed
    terminal: true
    enter:
      set:
        status: completed
        finished_at: now_utc

  - name: failed
    terminal: true
    enter:
      set:
        status: failed
        finished_at: now_utc

modifiers:
  - id: fraud-brownout
    when:
      t_between_seconds: [240, 360]
    where:
      stage: running
      report_type: FRAUD
    effects:
      duration_mult: 2.5
      fail_add: 0.15
      set:
        incident: fraud-brownout
