      to:   "15:00"
      shape: sine
      rps_avg: 25
      rps_amp: 10
      period: "2m"

  latency:
    base_ms: 250
    jitter_ms: 40
    coupling:
      per_rps_ms: 8

  errors:
    base_rate: 0.003
    incidents:
      - id: "inc-timeout-1"
        at: "06:00"
        duration: "2m"
        error_rate: 0.12
        error_code: "E_TIMEOUT"
        extra_latency_ms: 250
        dependency: "bureau_api"
        tags: ["brownout", "bureau_api", "timeout"]
        scope:
          report_type: "credit_report"

  hotspots:
    - at: "11:00"
      duration: "2m"
      subscriber_id: "sub-0042"
      extra_error_rate: 0.08
      extra_latency_ms: 300
