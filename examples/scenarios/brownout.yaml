meta:
  scenario_id: "brownout_demo"
  seed: 123
  start_time: "2025-12-19T09:00:00Z"
  duration: "15m"
  tick: "1s"

population:
  subscribers: 200
  report_types:
    credit_report: 0.5
    fraud_report: 0.3
    identity_report: 0.2

tracks:
  traffic:
    - from: "00:00"
      to:   "05:00"
      shape: constant
      rps: 10
    - from: "05:00"
      to:   "10:00"
      shape: ramp
      rps_from: 10
      rps_to: 40
