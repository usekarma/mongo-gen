overlay_id: overlay_2h_demo
overlay_start: "2025-12-22T16:00:00Z"

layers:
  - name: baseline
    scenario_id: baseline
    window_start: 0s
    window_for: 2h
    rps: 4
    seed: 101
    base_latency_ms: 200
    jitter_ms: 40
    base_error_rate: 0.001

  - name: brownout_bureau
    scenario_id: brownout_bureau_api
    window_start: 30m
    window_for: 10m
    rps: 8
    seed: 202
    brownout:
      at: 0m
      for: 10m
      error_rate: 0.15
      extra_latency_ms: 350
      dependency: bureau_api
      error_code: E_TIMEOUT
      incident_id: inc-timeout-1
      tags: [brownout, timeout, bureau_api]
      report_type: credit_report

  - name: load_spike
    scenario_id: load_spike
    window_start: 55m
    window_for: 5m
    rps: 25
    seed: 303
    base_latency_ms: 260
    jitter_ms: 90
    base_error_rate: 0.03

  - name: hotspot
    scenario_id: hotspot_sub_0042
    window_start: 80m
    window_for: 3m
    rps: 12
    seed: 404
    brownout:
      at: 0m
      for: 3m
      error_rate: 0.20
      extra_latency_ms: 250
      dependency: fraud_api
      error_code: E_429
      incident_id: inc-rate-1
      tags: [hotspot, rate_limit]
      report_type: fraud_report
