[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-gen"
version = "1.0.0"
description = "Staged workflow simulator that writes Mongo inserts/updates for CDC->Kafka->ClickHouse demos"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pymongo>=4.6",
]

[project.scripts]
mongo-gen = "mongo_gen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
