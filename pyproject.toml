[project]
name = "mongo-gen"
version = "0.1.0"
description = "Config-driven fake data generator framework for MongoDB (SLA demo scenarios)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymongo>=4.6",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "typer>=0.12",
]

[project.scripts]
mongo-gen = "mongo_gen.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

