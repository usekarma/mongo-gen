[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-gen"
version = "0.1.0"
description = "Deterministic scenario-driven synthetic event generator (timeline 'drawing program')"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
mongo-gen = "mongo_gen.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
